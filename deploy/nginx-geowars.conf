# nginx site for GeoWars. Replace example.com with your domain.
# Install: sudo cp deploy/nginx-geowars.conf /etc/nginx/sites-available/geowars
#          sudo ln -s /etc/nginx/sites-available/geowars /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d example.com   (then set COOKIE_SECURE=true in .env)
server {
    listen 80;
    server_name example.com;

    # Built web client (npm run build -w @geowars/web) plus the generated geo files
    root /opt/geowars/apps/web/dist;
    index index.html;

    location /api/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /geo/ {
        gzip on;
        gzip_types application/json application/geo+json;
        expires 1d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
